<!DOCTYPE html>

<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EMS Pro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a227f",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121320",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="flex h-screen overflow-hidden">
    <!-- Side Navigation -->
    <aside class="w-64 flex-shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
        <div class="p-6 flex items-center gap-3">
            <div class="bg-primary rounded-lg p-2 text-white">
                <span class="material-symbols-outlined">corporate_fare</span>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight leading-none">EMS Pro</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">HR Portal</p>
            </div>
        </div>
        <nav class="flex-1 px-4 space-y-1">
            <a class="sidebar-link flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
               href="#"
               data-page="admin-dashboard-home.html">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="text-sm font-medium">Dashboard</span>
            </a>
            <a class="sidebar-link flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
               href="#"
               data-page="admin-dashboard-employee.html">
                <span class="material-symbols-outlined">group</span>
                <span class="text-sm font-medium">Employees</span>
            </a>
            <a class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
               href="#"
            >
                <span class="material-symbols-outlined">domain</span>
                <span class="text-sm font-medium">Departments</span>
            </a>
        </nav>
        <div class="p-4 border-t border-slate-200 dark:border-slate-800">
            <a class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
               href="#"
               data-page="admin-dashboard-department.html">
                <span class="material-symbols-outlined">settings</span>
                <span class="text-sm font-medium">Settings</span>
            </a>
            <button onclick="logout()"
                    class="w-full flex items-center gap-3 px-3 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors">

                <span class="material-symbols-outlined">logout</span>
                <span class="text-sm font-medium">Logout</span>
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-8 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shrink-0">
            <div class="flex items-center flex-1 max-w-md">
                <div class="relative w-full">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">search</span>
                    <input class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-lg pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-primary focus:outline-none dark:text-slate-100"
                           placeholder="Search employees, IDs, or departments..." type="text"/>
                </div>
            </div>
            <div class="flex items-center gap-4">

                <div class="h-8 w-[1px] bg-slate-200 dark:border-slate-800"></div>
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <p id="user-name" class="text-sm font-semibold leading-none"></p>
                        <p id="user-role" class="text-xs text-slate-500 mt-1"></p>
                    </div>
                    <div id="user-avatar"
                         class="h-10 w-10 rounded-full bg-primary/10 flex items-center justify-center font-bold text-blue-500 border border-primary/20">
                    </div>
                </div>
            </div>
        </header>
        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <div id="main-content"></div>
        </main>
    </div>


</div>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/dashboard-user.js"></script>
<script src="assets/js/dashboard-home.js"></script>
<script src="assets/js/content-loader.js"></script>
<script src="assets/js/hr-dashboard-emp.js"></script>
<script src="assets/js/add-employee.js"></script>
<script src="assets/js/view-employee.js"></script>
<script src="assets/js/upate-employee.js"></script>
<script src="assets/js/logout.js"></script>
</body>
</html>
