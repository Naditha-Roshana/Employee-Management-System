<!DOCTYPE html>

<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EMS Pro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a227f",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121320",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="flex h-screen overflow-hidden">
    <!-- Side Navigation -->
    <aside class="w-64 flex-shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
        <div class="p-6 flex items-center gap-3">
            <div class="bg-primary rounded-lg p-2 text-white">
                <span class="material-symbols-outlined">corporate_fare</span>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight leading-none">EMS Pro</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Manager Portal</p>
            </div>
        </div>
        <nav class="flex-1 px-4 space-y-1">

            <a class="sidebar-link flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
               href="#"
               data-page="admin-dashboard-employee.html">
                <span class="material-symbols-outlined">group</span>
                <span class="text-sm font-medium">Employees</span>
            </a>

        </nav>
        <div class="p-4 border-t border-slate-200 dark:border-slate-800">
            <a class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
               href="#"
               data-page="admin-dashboard-department.html">
                <span class="material-symbols-outlined">settings</span>
                <span class="text-sm font-medium">Settings</span>
            </a>

            <button onclick="logout()"
                    class="w-full flex items-center gap-3 px-3 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors">

                <span class="material-symbols-outlined">logout</span>
                <span class="text-sm font-medium">Logout</span>
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-8 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shrink-0">
            <div class="flex items-center flex-1 max-w-md">
                <div class="relative w-full"></div>
            </div>
            <div class="flex items-center gap-4">

                <div class="h-8 w-[1px] bg-slate-200 dark:border-slate-800"></div>
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <p id="user-name" class="text-sm font-semibold leading-none"></p>
                        <p id="user-role" class="text-xs text-slate-500 mt-1"></p>
                    </div>
                    <div id="user-avatar"
                         class="h-10 w-10 rounded-full bg-primary/10 flex items-center justify-center font-bold text-blue-500 border border-primary/20">
                    </div>
                </div>
            </div>
        </header>
        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">

            <!-- Page Content -->
            <div class="flex-1 overflow-y-auto p-8">
                <!-- Page Title & CTA -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                    <div>
                        <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Employee
                            Directory</h2>
                        <p class="text-slate-500 dark:text-slate-400">Total 1,248 active members across all departments</p>
                    </div>
                </div>
                <!-- Stats Overview -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                                <span class="material-symbols-outlined">group</span>
                            </div>
                            <div>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Total Employees</p>
                                <p id="empTot" class="text-2xl font-bold"></p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-lg">
                                <span class="material-symbols-outlined">check_circle</span>
                            </div>
                            <div>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Active Now</p>
                                <p id="activeEMP" class="text-2xl font-bold"></p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 rounded-lg">
                                <span class="material-symbols-outlined">code</span>
                            </div>
                            <div>
                                <p class="text-sm text-slate-500 dark:text-slate-400">Developers</p>
                                <p id="devEMP" class="text-2xl font-bold"></p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="p-3 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 rounded-lg">
                                <span class="material-symbols-outlined">event_busy</span>
                            </div>
                            <div>
                                <p class="text-sm text-slate-500 dark:text-slate-400">InActive</p>
                                <p id="inActiveEMP" class="text-2xl font-bold"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Filters -->
                <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm mb-6 flex flex-wrap items-center gap-4">
                    <div class="flex gap-2">
                        <button class="px-4 py-1.5 rounded-lg bg-primary text-white text-sm font-medium">All Employees
                        </button>
                        <button class="px-4 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-medium">
                            Active
                        </button>
                        <button class="px-4 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-medium">
                            Inactive
                        </button>
                    </div>
                    <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 mx-2"></div>

                    <div class="ml-auto">
                        <select class="bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-600 dark:text-slate-300 focus:ring-primary">
                            <option>All Departments</option>
                            <option>Developing</option>
                            <option>Marketing</option>
                            <option>Human Resources</option>
                            <option>Sales</option>
                        </select>
                    </div>
                </div>
                <!-- Table Content -->
                <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto @container">
                        <table class="w-full text-left border-collapse">
                            <thead>
                            <tr class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800">
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                    ID
                                </th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                    Full Name
                                </th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                    Department
                                </th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                    Position
                                </th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                    Status
                                </th>
                            </tr>
                            </thead>
                            <tbody id="employee-table-body"
                                   class="divide-y divide-slate-200 dark:divide-slate-800">
                            <!-- Row 1 -->
                            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">

                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>
        </main>
    </div>


</div>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/dashboard-user.js"></script>
<script src="assets/js/dashboard-emp.js"></script>
<script src="assets/js/m-dashboard-view.js"></script>
<script src="assets/js/logout.js"></script>
</body>
</html>
