<!DOCTYPE html>

<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ems Pro</title>
    <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
    <script src="assets/js/register.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a237e",
                        "accent": "#4caf50",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121320",
                        "surface-dark": "#1c1e30",
                        "border-dark": "#393c60",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>

</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
        <!-- Navigation Header -->
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-border-dark px-6 md:px-10 py-3 bg-background-dark">
            <div class="flex items-center gap-4">
                <div class="size-8 text-accent">
                    <svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z"
                              fill="currentColor"></path>
                    </svg>
                </div>
                <h2 class="text-slate-100 text-lg font-bold leading-tight tracking-tight">EMS Pro</h2>
            </div>
            <div class="flex items-center gap-4">
                <button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary/20 hover:bg-primary/40 text-slate-100 text-sm font-semibold transition-colors">
                    <span>Support</span>
                </button>
            </div>
        </header>

        <main class="flex flex-1 items-center justify-center p-4">
            <div class="w-full max-w-[480px] flex flex-col gap-8 bg-surface-dark/40 p-8 rounded-xl border border-border-dark shadow-2xl">
                <!-- Hero/Header Section inside Card -->
                <div class="flex flex-col gap-2">
                    <div class="w-12 h-1 bg-accent rounded-full mb-2"></div>
                    <h1 class="text-slate-100 text-3xl font-bold tracking-tight">System Registration</h1>
                    <p class="text-slate-400 text-sm font-normal">Register a new System Manager in the Management
                        System.</p>
                </div>
                <form class="flex flex-col gap-6">
                    <!-- Username -->
                    <label class="flex flex-col w-full">
                        <span class="text-slate-200 text-sm font-medium pb-2">Username</span>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">person</span>
                            <input id="username"
                                   class="form-input flex w-full rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-accent border border-border-dark bg-surface-dark h-12 pl-10 placeholder:text-slate-500 text-base"
                                   placeholder="e.g. sample_admin" type="text"/>
                        </div>
                    </label>

                    <!-- Employee Selection -->
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-700 dark:text-slate-200 text-sm font-semibold leading-normal">Select Your Name and Id</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                            <select id="employee"
                                    class="form-select flex w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary h-12 pl-11 text-slate-900 dark:text-white text-base transition-all appearance-none">
                            <!--sample options-->
                                <option value="2">Janith Pereira (ID: 2)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Role Selection -->
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-700 dark:text-slate-200 text-sm font-semibold leading-normal">Role</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">badge</span>
                            <select id="role"
                                    class="form-select flex w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary h-12 pl-11 text-slate-900 dark:text-white text-base transition-all appearance-none">
                                <option value="admin">ADMIN</option>
                                <option value="hr">HR</option>
                                <option value="manager">MANAGER</option>
                                <option value="employee">Standard Employee</option>
                            </select>
                        </div>
                    </div>
                    <!-- Secret Code -->
                    <label class="flex flex-col w-full">
                        <div class="flex justify-between items-center pb-2">
                            <span class="text-slate-200 text-sm font-medium">Registration Code</span>
                        </div>
                        <div class="relative flex w-full items-stretch rounded-lg group">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">code</span>
                            <input id="secretCode"
                                   class="form-input flex w-full rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-accent border border-border-dark bg-surface-dark h-12 pl-10 pr-12 placeholder:text-slate-500 text-base"
                                   placeholder="••••••••" type="password"/>
                            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300"
                                    type="button">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </div>
                    </label>
                    <!-- Password -->
                    <label class="flex flex-col w-full">
                        <div class="flex justify-between items-center pb-2">
                            <span class="text-slate-200 text-sm font-medium">Password</span>
                            <!--                                <a class="text-accent text-xs font-medium hover:underline" href="#">Forgot password?</a>-->
                        </div>
                        <div class="relative flex w-full items-stretch rounded-lg group">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">lock</span>
                            <input id="password"
                                   class="form-input flex w-full rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-accent border border-border-dark bg-surface-dark h-12 pl-10 pr-12 placeholder:text-slate-500 text-base"
                                   placeholder="••••••••" type="password"/>
                            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300"
                                    type="button">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </div>
                    </label>

                    <!-- Submit Button -->
                    <button class="flex w-full cursor-pointer items-center justify-center rounded-lg h-12 px-4 border border-accent/50 text-accent hover:bg-accent/10 text-sm font-bold transition-all"
                            type="submit"
                            onclick="register(event)">
                        <span class="truncate text-center">Create Account</span>
                    </button>
                </form>
                <!-- Redirect to Login -->
                <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 text-center">
                    <p class="text-slate-500 dark:text-slate-400 text-sm">
                        Already have an account?
                        <a class="text-primary font-bold hover:underline ml-1" href="index.html">Log in here</a>
                    </p>
                </div>
            </div>
        </main>
        <!-- Decorative Background Elements -->
        <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-accent/5 blur-[120px]"></div>
        </div>
    </div>
</div>
</body>
</html>
