<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Page Content -->
    <div class="flex-1 overflow-y-auto p-8">
        <!-- Page Title & CTA -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Employee
                    Directory</h2>
                <p class="text-slate-500 dark:text-slate-400">Total 1,248 active members across all departments</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="loadPage('add-employee.html')"
                        class="flex items-center gap-2 px-4 py-2.5 bg-primary hover:bg-primary/90 text-white rounded-lg text-sm font-bold transition-all shadow-lg shadow-primary/20">
                    <span class="material-symbols-outlined text-xl">person_add</span>
                    Add New Employee
                </button>
            </div>
        </div>
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                        <span class="material-symbols-outlined">group</span>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Total Employees</p>
                        <p id="empTot" class="text-2xl font-bold"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-lg">
                        <span class="material-symbols-outlined">check_circle</span>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Active Now</p>
                        <p id="activeEMP" class="text-2xl font-bold"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 rounded-lg">
                        <span class="material-symbols-outlined">code</span>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Developers</p>
                        <p id="devEMP" class="text-2xl font-bold"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 rounded-lg">
                        <span class="material-symbols-outlined">event_busy</span>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 dark:text-slate-400">InActive</p>
                        <p id="inActiveEMP" class="text-2xl font-bold"></p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Filters -->
        <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm mb-6 flex flex-wrap items-center gap-4">
            <div class="flex gap-2">
                <button class="px-4 py-1.5 rounded-lg bg-primary text-white text-sm font-medium">All Employees
                </button>
                <button class="px-4 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-medium">
                    Active
                </button>
                <button class="px-4 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-medium">
                    Inactive
                </button>
            </div>
            <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 mx-2"></div>

            <div class="ml-auto">
                <select class="bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-600 dark:text-slate-300 focus:ring-primary">
                    <option>All Departments</option>
                    <option>Developing</option>
                    <option>Marketing</option>
                    <option>Human Resources</option>
                    <option>Sales</option>
                </select>
            </div>
        </div>
        <!-- Table Content -->
        <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="overflow-x-auto @container">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800">
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                            ID
                        </th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                            Full Name
                        </th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                            Department
                        </th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                            Position
                        </th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                            Status
                        </th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider text-right">
                            Actions
                        </th>
                    </tr>
                    </thead>
                    <tbody id="employee-table-body"
                           class="divide-y divide-slate-200 dark:divide-slate-800">
                    <!-- Row 1 -->
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">

                    </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </div>
</main>
